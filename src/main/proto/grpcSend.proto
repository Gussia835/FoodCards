syntax = "proto3";

option java_multiple_files = true;
option java_package = "proto";

package sendGRPC;

message FileChunk {
    string filename = 1;
    int64 offset = 2;
    bytes data = 3;
    bool is_last = 4;
    map<string, string> metadata = 5;
}

message UploadResponse {
  string status = 1;
  string remote_id = 2;
  int64 total_bytes = 3;
}

service FileTransport {
  rpc Upload(stream FileChunk) returns (UploadResponse);
}
